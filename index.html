<!DOCTYPE html>
<html lang="uz" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ustoz Abroad - Study Beyond Borders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <script>
    // Sahifa yuklanishidan oldin mavzuni tekshirish (Flash of white oldini olish)
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .nav-link-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
    /* Dark mode transition effect */
    html.dark { color-scheme: dark; }
    * { transition: background-color 0.2s ease, border-color 0.2s ease; }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm dark:bg-slate-900/90 dark:border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
            <div class="bg-blue-600 p-2 rounded-lg mr-2">
              <i data-lucide="globe" class="text-white w-6 h-6"></i>
            </div>
            <span class="text-2xl font-bold text-blue-900 dark:text-white tracking-tight">Ustoz Abroad</span>
          </div>

          <nav id="mainNav" class="hidden md:flex space-x-6 h-full items-center">
            <!-- JS dynamic content -->
          </nav>

          <div class="hidden md:flex items-center space-x-4">
            <!-- Theme Toggle -->
            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors" id="themeToggle">
              <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
              <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>

            <select id="langSwitcher" onchange="handleLangChange(event)" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-lg px-2 py-1 outline-none">
              <option value="uz">O'Z</option>
              <option value="ru">RU</option>
              <option value="en">EN</option>
            </select>
            <button id="authBtn" onclick="navigateTo('admin')" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-blue-700 transition-all shadow-md active:scale-95">
              Sign In
            </button>
          </div>

          <div class="md:hidden flex items-center space-x-2">
             <button onclick="toggleDarkMode()" class="p-2 text-slate-500 dark:text-slate-400">
              <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
              <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>
            <button onclick="toggleMobileMenu()" class="p-2 text-slate-600 dark:text-slate-400">
              <i data-lucide="menu" id="menuIcon"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div id="mobileMenu" class="hidden md:hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 py-4 px-4 space-y-4 shadow-xl">
        <!-- JS dynamic content -->
      </div>
    </header>

    <!-- Content Area -->
    <main id="mainContent" class="flex-grow"></main>

    <!-- Footer -->
    <footer class="bg-slate-900 dark:bg-black text-white py-12">
      <div class="max-w-7xl mx-auto px-4 text-center">
        <div class="flex items-center justify-center mb-6">
          <i data-lucide="globe" class="text-blue-500 w-6 h-6 mr-2"></i>
          <span class="text-xl font-bold tracking-tight">Ustoz Abroad</span>
        </div>
        <p id="footerText" class="text-slate-500 text-sm mb-8"></p>
        <div class="flex justify-center space-x-6 text-slate-400 text-[10px] uppercase tracking-widest font-bold">
          <a href="#" class="hover:text-blue-400">Telegram</a>
          <a href="#" class="hover:text-blue-400">Instagram</a>
          <a href="#" class="hover:text-blue-400">Contact</a>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="index.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
